<!DOCTYPE html>
<html lang='tr'>
<head>
<meta charset='utf-8'>
<title>Antrenör</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee}
 header{padding:12px 20px;background:#1b1b1b;display:flex;gap:12px;align-items:center}
 h1{font-size:18px;margin:0;flex:1}
 h2{font-size:15px;margin:0 0 8px}
 main{display:grid;grid-template-columns:320px 1fr 300px;gap:16px;padding:16px;height:calc(100vh - 70px)}
 section{background:#1b1b1b;border-radius:8px;padding:12px;overflow:auto}
 input,select{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:6px;padding:6px;width:100%;box-sizing:border-box;margin-bottom:8px}
 button{background:#2d6cdf;color:#fff;border:0;padding:6px 10px;border-radius:6px;cursor:pointer}
 button.gri{background:#444}
 .hareket{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #2a2a2a;font-size:14px;cursor:pointer}
 .gun{border:1px solid #333;border-radius:8px;padding:10px;margin-bottom:12px}
 .satir{display:grid;grid-template-columns:1fr 60px 60px 30px;gap:6px;align-items:center;margin-top:6px;font-size:14px}
 .satir input{margin:0}
 .cubuk{background:#2d6cdf;height:10px;border-radius:5px}
 .kas{font-size:13px;margin-bottom:8px}
 img{max-width:100%;border-radius:8px}
</style>
</head>
<body>
<header>
 <h1>Antrenör: Program Oluşturucu</h1>
 <button id='gunEkle'>+ Gün ekle</button>
 <button id='temizle' class='gri'>Programı sıfırla</button>
</header>
<main>
 <section>
  <h2>Hareketler</h2>
  <input id='ara' placeholder='Hareket ara...'>
  <select id='kasFiltre'><option value=''>Tüm kaslar</option></select>
  <div id='liste'>Yükleniyor...</div>
 </section>
 <section>
  <h2>Programım</h2>
  <div id='program'></div>
 </section>
 <section>
  <h2>Haftalık set hacmi</h2>
  <div id='hacim'></div>
  <h2 style='margin-top:16px'>Önizleme</h2>
  <div id='onizleme'>Bir harekete tıkla.</div>
 </section>
</main>
<script src='app.js'></script>
</body>
</html>
